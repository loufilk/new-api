name: Database Compatibility

on:
  push:
    branches:
      - main
      - 'codex/**'
      - merge/wanchuan-main-customizations-20260904
  pull_request:
  workflow_dispatch:

env:
  GOWORK: 'off'

permissions:
  contents: read

concurrency:
  group: database-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL 18.6 real migration
    # Keep the dedicated Runner policy outside the isolated maintenance branch.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/codex/runtime-stability-maintenance-20260924' && '["self-hosted","linux","x64","us-vps-ci"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: compat
          POSTGRES_DB: newapi_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_compat"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_COMPAT: '1'
      TEST_DATABASE_DIALECT: postgres
      TEST_DATABASE_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat?sslmode=disable
      TEST_LOG_DATABASE_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat_log?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Create frontend embed placeholder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Create independent PostgreSQL log database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres newapi_compat_log
      - name: PostgreSQL migration, CRUD, payment and BIGINT checks
        run: |
          set -euo pipefail
          go test ./model -run '^(TestDatabaseCompatibilityReal|TestMoneyColumnsAre64BitOnConfiguredDatabases|TestSupportTicketSchemaConfiguredDatabases)$' -count=1 -v
          go test ./pkg/paymentcore -list '^TestPaymentOrderBindingDatabaseCompatibilityReal$' | grep -Fx 'TestPaymentOrderBindingDatabaseCompatibilityReal'
          go test ./pkg/paymentcore -run '^TestPaymentOrderBindingDatabaseCompatibilityReal$' -count=1 -v
      - name: Split-wallet pre-consume policy on PostgreSQL
        run: go test ./controller -run '^TestPreConsumePolicyDatabaseMatrix$/postgres' -count=1 -v


