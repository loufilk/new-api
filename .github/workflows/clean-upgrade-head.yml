name: Clean upgrade exact-head validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-head-${{ github.ref }}
  cancel-in-progress: true

# Existing CI remains the merge/event-commit integration check. This workflow
# checks the immutable candidate head separately; never infer head evidence from
# a merge-ref result. It uses pull_request, never pull_request_target.
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GOTOOLCHAIN: local
  GOFLAGS: '-mod=readonly'
jobs:
  backend:
    name: Exact head backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Attest exact head and setup-version bounds
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          out="$RUNNER_TEMP/clean-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ github.job }}"
          mkdir -p "$out"
          printf 'OUT=%s\n' "$out" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$out/source-identity.txt"
          python3 - <<'PYVERSION'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not 0 < len(version) <= 50:
              raise SystemExit('VERSION must fit existing setups.version varchar(50); preserve full SHA in provenance')
          print(version)
          PYVERSION

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Record compiler version
        run: go version | tee "$OUT/go-version.txt"

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

      - name: Race tests
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
        run: |
          # SQLite-heavy controller tests can exceed Go's default 10m under -race.
          # Bound resource contention and runtime without reducing test coverage.
          go test -race -p 2 -count=1 -timeout=20m ./...
          cd relaykit
          go test -race -p 2 -count=1 -timeout=20m ./...

      - name: Release evidence gate tests
        run: python3 -m unittest discover -s ops/server/tests -p test_release_gate.py -v

      - name: Preserve exact-head identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-head-backend-${{ env.SOURCE_SHA }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Exact head frontend typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Attest exact head and setup-version bounds
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          out="$RUNNER_TEMP/clean-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ github.job }}"
          mkdir -p "$out"
          printf 'OUT=%s\n' "$out" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$out/source-identity.txt"
          python3 - <<'PYVERSION'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not 0 < len(version) <= 50:
              raise SystemExit('VERSION must fit existing setups.version varchar(50); preserve full SHA in provenance')
          print(version)
          PYVERSION

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: bun audit --production

      - name: Lint
        run: bun run lint:ci

      - name: Format check
        run: bun run format:check

      - name: Copyright check
        run: bun run copyright:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Preserve exact-head identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-head-frontend-${{ env.SOURCE_SHA }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 7
