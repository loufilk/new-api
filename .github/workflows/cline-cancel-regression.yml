name: Isolated Cline cancellation regression

on:
  push:
    branches: [codex/cline-cancel-regression-20261002]
    paths:
      - .github/workflows/cline-cancel-regression.yml
      - ops/upgrade/cline_cancel_20261002.patch.b64
      - ops/upgrade/cline_cancel_inflight_20261002.patch.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cline-cancel-regression-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: '-mod=readonly'
  SQL_DSN: ''
  LOG_SQL_DSN: ''
  REDIS_CONN_STRING: ''
  TEST_DATABASE_COMPAT: ''
  TEST_DATABASE_DIALECT: ''
  TEST_DATABASE_DSN: ''
  TEST_LOG_DATABASE_DSN: ''
  TEST_MYSQL_DSN: ''
  TEST_POSTGRES_DSN: ''
  TEST_RUNTIME_REDIS: ''
  TEST_REDIS_DSN: ''

jobs:
  verify:
    if: github.repository == '1057300248/wanchuan-new-api' && github.ref == 'refs/heads/codex/cline-cancel-regression-20261002'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksum-verified patches to the exact isolated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 81d24dc134a9992c9b7f6790b6ce215499c22ce3 HEAD
          git merge-base --is-ancestor 62d951fab129f4df1a921735835e5e9c7b8db031 HEAD
          out="$RUNNER_TEMP/cline-cancel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out" web/dist
          touch web/dist/index.html
          printf 'OUT=%s\n' "$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/recipe-revision.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, os
          expected = {
            'controller/relay.go', 'controller/relay_cancellation_test.go',
            'pkg/perf_metrics/client_gone_test.go', 'pkg/perf_metrics/outcome.go',
            'relay/channel/api_request.go', 'relay/channel/cline/adaptor.go',
            'relay/channel/cline/cancellation_entrypoint_test.go', 'relay/channel/cline/content.go',
            'relay/channel/cline/plain_text.go', 'relay/channel/cline/plain_text_test.go',
            'relay/channel/openai/responses_via_chat.go', 'relay/helper/stream_result.go',
            'service/relay_cancellation.go', 'service/relay_cancellation_test.go',
            'service/relay_error.go', 'service/request_policy.go',
          }
          specs = [
            ('cline_cancel_20261002', '1ff7b35227ab696deee26acda28e05a10d8befd49e841e02e651ebc37c655c3d', 'service/relay_cancellation.go', 'func RelayRequestCancellation('),
            ('cline_cancel_inflight_20261002', '0d44aca9fcdcee18a1dcf19c76235a5dee45f97463e016558244a58015e19430', 'relay/channel/cline/cancellation_entrypoint_test.go', 'func TestClineCancellationInterruptsInFlightUpstream('),
          ]
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / ('cline-cancel-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          for name, checksum, marker_path, marker in specs:
              patch = gzip.decompress(base64.b64decode(pathlib.Path('ops/upgrade/' + name + '.patch.b64').read_text().strip(), validate=True))
              digest = hashlib.sha256(patch).hexdigest()
              assert digest == checksum, (name, digest)
              actual = {line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
              assert actual <= expected, actual - expected
              p = pathlib.Path(marker_path)
              if p.exists() and marker in p.read_text():
                  print('Verifying existing source without replaying', name)
              else:
                  subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
                  subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              (out / (name + '.patch')).write_bytes(patch)
              (out / (name + '.sha256')).write_text(digest + '\n')
          (out / 'changed-files.txt').write_text('\n'.join(sorted(expected)) + '\n')
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git diff --cached --check
          git write-tree > "$out/tested-tree.txt"
          git archive --format=tar.gz -o "$out/tested-source.tar.gz" "$(cat "$out/tested-tree.txt")"
          sha256sum "$out/tested-source.tar.gz" > "$out/tested-source.sha256"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Module integrity and real application build
        run: |
          set -euo pipefail
          go version | tee "$OUT/go-version.txt"
          go mod verify | tee "$OUT/module-verify.log"
          go build -p 2 ./... > "$OUT/root-build.log" 2>&1
          go vet -p 2 ./... > "$OUT/root-vet.log" 2>&1
          git diff --exit-code HEAD -- go.mod go.sum relaykit/go.mod relaykit/go.sum
      - name: Require cancellation, no-fallback, media and once-only accounting contracts
        run: |
          set -euo pipefail
          go test -race -p 2 ./service ./controller ./relay/channel/cline ./relay/channel/openai ./relay/helper ./pkg/perf_metrics -run 'Test(RelayCancellation|RelayRetriesStillWork|RelayCancelledBefore|Cline|DownstreamWriteFailure|StreamFailurePartialUsage|StreamFailureWithoutUsage)' -count=1 -timeout=12m -json > "$OUT/incident-regressions.jsonl" 2> "$OUT/incident-regressions.stderr.log"
          python3 ops/ci/check_go_test_report.py "$OUT/incident-regressions.jsonl" TestRelayCancellationPrecedesChannelErrorsAndRetryBudget TestRelayCancellationDoesNotDisableHealthyPool TestRelayRetriesStillWorkForLiveRequestUpstreamFailures TestRelayCancelledBeforeDispatchDoesNotSelectOrWrite TestClineResponsesDoneThenCancellationNeverFallsBack TestClineResponsesDeliveryFailureAndLateCleanup TestClineCancelledRequestDoesNotReadBodyOrDial TestClineCancellationInterruptsInFlightUpstream TestClinePlainTextWireRemainsByteIdentical TestClineMediaAcrossEntryProtocolsAndStreamModes TestClineFinalWireValidationRunsAfterParameterOverrides TestDownstreamWriteFailureIsNotUpstreamHealthFailure TestStreamFailurePartialUsageSettlesOnceAndNeverRefunds TestStreamFailureWithoutUsageRefundsReservationOnce
      - name: Complete root regressions without exclusions
        if: success() || failure()
        run: |
          set -euo pipefail
          go test -p 2 ./... -count=1 -timeout=15m -json > "$OUT/root-tests.jsonl" 2> "$OUT/root-tests.stderr.log"
      - name: Complete root race regressions without exclusions
        if: success() || failure()
        run: |
          set -euo pipefail
          go test -race -p 2 ./... -count=1 -timeout=15m -json > "$OUT/root-race.jsonl" 2> "$OUT/root-race.stderr.log"
      - name: Independent relaykit build, vet and full race regressions
        if: success() || failure()
        working-directory: relaykit
        run: |
          set -euo pipefail
          go build -p 2 ./... > "$OUT/relaykit-build.log" 2>&1
          go vet -p 2 ./... > "$OUT/relaykit-vet.log" 2>&1
          go test -race -p 2 ./... -count=1 -timeout=10m -json > "$OUT/relaykit-race.jsonl" 2> "$OUT/relaykit-race.stderr.log"
      - name: Evidence and release gate regressions
        if: success() || failure()
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ops/ci/tests -p 'test_*.py' -v > "$OUT/evidence-tests.log" 2>&1
          python3 -m unittest discover -s ops/server/tests -p test_release_gate.py -v > "$OUT/release-gate-tests.log" 2>&1
      - name: Publish tested source only to the isolated incident branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/cline-cancel-regression-20261002'
          test "$GITHUB_REPOSITORY" = '1057300248/wanchuan-new-api'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$OUT/tested-tree.txt")"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(relay): stop abandoned Cline retries and preserve observed stream usage' -m 'AI-assisted incident fix on the upgraded database candidate. Propagate parent cancellation into HTTP requests, preserve canonical text wire payloads, never retry or disable a pool after downstream cancellation, and keep observed usage for existing once-only settlement. No production deployment.'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF"
          fi
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$OUT/tested-tree.txt")"
          git log -1 --format='%H%n%T%n%P%n%s' | tee "$OUT/published-revision.txt"
          printf 'Verified source commit: %s\nRecipe commit: %s\nTested tree: %s\nNo deployment performed.\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$(cat "$OUT/tested-tree.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Save failure details without hiding test errors
        if: always()
        run: |
          if [ -n "${OUT:-}" ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          for path in sorted(root.glob('*.jsonl')):
              failed = []
              counts = {}
              for line in path.read_text().splitlines():
                  event = json.loads(line)
                  if event.get('Test') and event.get('Action') in {'pass', 'skip', 'fail'}:
                      action = event['Action']
                      counts[action] = counts.get(action, 0) + 1
                  if event.get('Action') in {'fail', 'build-fail'}:
                      failed.append({k: event[k] for k in ('Package', 'Test', 'Action') if k in event})
              print(path.name, counts, 'failures:', failed)
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cline-cancel-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cline-cancel-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
